name: Catalog sync

# The catalog rots quietly: upstream projects get archived, images get pulled
# from registries, pinned majors fall behind. This runs weekly and files the
# findings in a single issue that it keeps updating, so there is one place to
# look instead of a pile of notifications.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Check catalog against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests
        run: npm run catalog:validate

      # Registries throttle anonymous pulls, so this can legitimately fail on a
      # bad day; record the outcome and report it rather than failing the run.
      - name: Resolve every image reference
        id: images
        continue-on-error: true
        run: npm run catalog:check-images 2>&1 | tee images.txt

      - name: Report on upstream projects
        id: sync
        continue-on-error: true
        run: node tools/catalog/sync.mjs --candidates 30 --out report.md

      - name: Assemble the issue body
        run: |
          [ -f images.txt ] || echo 'Image check did not run.' > images.txt
          [ -f report.md ] || echo '## Upstream report\n\nSync did not run; see the workflow log.' > report.md
          {
            echo "Generated by [\`catalog-sync\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u +%Y-%m-%d)."
            echo
            echo '## Image references'
            echo
            echo '```'
            cat images.txt
            echo '```'
            echo
            cat report.md
          } > body.md

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Catalog sync report'
          existing=$(gh issue list --state open --label catalog-sync --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh label create catalog-sync --description 'Automated app catalog health report' --color 0e8a16 --force
            gh issue create --title "$title" --label catalog-sync --body-file body.md
          fi
