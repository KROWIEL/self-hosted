name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # The whole history, not just the push range: a secret is just as exposed
      # in an old commit as in a new one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest
          git --redact --no-banner --config .gitleaks.toml .

  js:
    name: Control plane & web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate app catalog manifests
        run: npm run catalog:validate

      - name: Build shared package
        run: npm run build --workspace @selfhosted/shared

      - name: Test control plane
        run: npm test --workspace @selfhosted/control-plane

      - name: Build control plane
        run: npm run build --workspace @selfhosted/control-plane

      - name: Build web
        run: npm run build --workspace @selfhosted/web

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile Linux binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agent-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/agent-linux-arm64 ./cmd/agent

      - name: Upload agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: services/agent/dist/*
          if-no-files-found: error
