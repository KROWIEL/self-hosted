name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  js:
    name: Control plane & web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build shared package
        run: npm run build --workspace @selfhosted/shared

      - name: Build control plane
        run: npm run build --workspace @selfhosted/control-plane

      - name: Build web
        run: npm run build --workspace @selfhosted/web

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
