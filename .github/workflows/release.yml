name: Release

# Pushing a tag like v1.2.3 publishes the panel images to GHCR and a GitHub
# release with the agent and tunnel binaries. Release notes are the matching
# section of CHANGELOG.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/krowiel/self-hosted-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  binaries:
    name: Binaries and release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Cross-compile
        working-directory: services/agent
        run: |
          set -e
          mkdir -p ../../dist
          ldflags="-s -w -X github.com/self-hosted/agent/internal/config.Version=${GITHUB_REF_NAME#v}"
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$ldflags" \
              -o "../../dist/$3-$1-$2$4" "./cmd/$3"
          }
          for arch in amd64 arm64; do
            build linux $arch agent ""
            build linux $arch tunnel-server ""
            build linux $arch tunnel-client ""
          done
          build windows amd64 tunnel-server .exe
          build windows amd64 tunnel-client .exe

      - name: Add install files and checksums
        run: |
          cp deploy/docker-compose.yml deploy/traefik.yml deploy/install.sh dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
