# gitleaks configuration — https://github.com/gitleaks/gitleaks
# Extends the built-in ruleset with a small allowlist for placeholder files.
title = "self-hosted secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Example / placeholder files and non-secret public keys"
paths = [
  '''\.env\.example$''',
  # Fixture: a stub PEM asserting the certificate parser rejects malformed input.
  '''services/agent/internal/certs/certs_test\.go$''',
]
regexes = [
  # Obvious dev placeholders shipped in .env.example.
  '''change-me[-a-z0-9]*''',
  '''changeme[0-9]*''',
]

[[allowlists]]
description = "Catalog images pinned to a git SHA, which reads as a generic API key"
condition = "AND"
regexTarget = "line"
paths = ['''catalog/apps/.*\.json$''']
regexes = ['''image: '[^']+:[0-9a-f]{40}''']
