version: "3"

tasks:
  bootstrap:
    desc: Install dependencies and start local infra
    cmds:
      - pnpm install
      - docker compose -f infra/dev/docker-compose.yml up -d
      - pnpm --filter @self-hosted/api prisma:generate
      - pnpm --filter @self-hosted/api prisma:push

  infra:up:
    desc: Start PostgreSQL and Redis
    cmds:
      - docker compose -f infra/dev/docker-compose.yml up -d

  infra:down:
    desc: Stop PostgreSQL and Redis
    cmds:
      - docker compose -f infra/dev/docker-compose.yml down

  dev:
    desc: Start API, panel and node-agent in watch mode
    cmds:
      - pnpm dev

  build:
    desc: Build all packages
    cmds:
      - pnpm build

  lint:
    desc: Run lint for all workspaces
    cmds:
      - pnpm lint

  test:
    desc: Run all tests
    cmds:
      - pnpm test

  typecheck:
    desc: Run type checking
    cmds:
      - pnpm typecheck

  security:
    desc: Run dependency security checks
    cmds:
      - pnpm security
