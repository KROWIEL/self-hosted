# Production stack for one server: the panel (API + web), PostgreSQL, Redis and
# Traefik, which serves the panel and every deployed app over HTTPS.
# Settings come from .env next to this file (deploy/install.sh writes it).
name: selfhosted

include:
  - traefik.yml

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfhosted
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: selfhosted
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhosted"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/krowiel/self-hosted-api:${SELFHOSTED_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://selfhosted:${POSTGRES_PASSWORD}@postgres:5432/selfhosted
      REDIS_URL: redis://redis:6379
      APP_BASE_URL: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PUBLIC_API_URL: https://${PANEL_DOMAIN}/api/v1
      PUBLIC_BASE_URL: https://${PANEL_DOMAIN}
      TRUST_PROXY: "1"
      LOCAL_AGENT_ENABLED: "0"
      AGENT_INSECURE_HTTP: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [default, edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.selfhosted-api.rule: Host(`${PANEL_DOMAIN}`) && PathPrefix(`/api`)
      traefik.http.routers.selfhosted-api.entrypoints: websecure
      traefik.http.routers.selfhosted-api.tls.certresolver: letsencrypt
      traefik.http.services.selfhosted-api.loadbalancer.server.port: "3001"

  web:
    image: ghcr.io/krowiel/self-hosted-web:${SELFHOSTED_VERSION:-latest}
    restart: unless-stopped
    depends_on: [api]
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.selfhosted-web.rule: Host(`${PANEL_DOMAIN}`)
      traefik.http.routers.selfhosted-web.entrypoints: websecure
      traefik.http.routers.selfhosted-web.tls.certresolver: letsencrypt
      traefik.http.services.selfhosted-web.loadbalancer.server.port: "3000"

volumes:
  postgres:
  redis:

