services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: self_hosted
      POSTGRES_USER: selfhosted
      POSTGRES_PASSWORD: selfhosted
    ports:
      - "5432:5432"
    volumes:
      - ../../infra-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ../../infra-data/redis:/data
