services:
  node-agent:
    build:
      context: ../../../
      dockerfile: infra/node/agent/node-agent.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      API_BASE_URL: ${API_URL:-http://your-vps-ip:4000}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN}
      AGENT_NODE_NAME: ${AGENT_NODE_NAME:-local-node}
      AGENT_WORKDIR: /var/lib/self-hosted/apps
      AGENT_STATE_FILE: /var/lib/self-hosted/state/agent-state.json
      RATHOLE_CLIENT_CONFIG_PATH: /etc/rathole/client.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../node-data/state:/var/lib/self-hosted/state
      - ../../node-data/apps:/var/lib/self-hosted/apps
      - ../rathole/client.toml:/etc/rathole/client.toml
